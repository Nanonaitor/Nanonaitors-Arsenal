# Keep release class outputs deterministic. A stale partial JavaCompile cache can
# otherwise produce a resource-complete JAR with only the most recently changed class.
org.gradle.caching=false
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true
