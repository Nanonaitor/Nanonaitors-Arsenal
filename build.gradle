plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}
version = '0.1.10'
group = 'com.nanonaitor.arsenal'
base.archivesName = 'nanonaitors-arsenal-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { nanonaitors_arsenal { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('clientSmokeTest')) property 'arsenal.clientSmokeTest', 'true'
            if (project.hasProperty('poseCapture')) property 'arsenal.poseCapture', 'true'
            if (project.hasProperty('combatProbe')) property 'arsenal.combatProbe', 'true'
            // -PposeSheets=scimitars,claws limits the capture to those sheets.
            if (project.hasProperty('poseSheets')) property 'arsenal.poseCapture.sheets', project.property('poseSheets')
        }
        server { args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', 'nanonaitors_arsenal,forge' }
        if (project.hasProperty('iafDev') || project.hasProperty('devMods')) configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}
// JEI is optional: compiled against its API, and only present at runtime in dev runs.
repositories { maven { url 'https://maven.blamejared.com' } }
// Dev-only optional-mod runs (-PdevMods=talents,rlcombat,mobends): each name is a folder in the
// git-ignored tmp/dev-mods holding that mod's jar and its dependencies, named <name>-<version>.jar.
def devModSets = project.hasProperty('devMods') ? project.property('devMods').toString().split(',')*.trim() : []
def devModJars = devModSets.collectMany { set -> (file("tmp/dev-mods/${set}").listFiles() ?: []) as List }
    .findAll { it.name.endsWith('.jar') }.unique { it.name }
if (devModJars) repositories { flatDir { dirs devModJars*.parentFile.unique() } }
// Dev-only Ice & Fire run (-PiafDev): jars copied into the git-ignored tmp/iaf-dev folder.
if (project.hasProperty('iafDev')) repositories { flatDir { dirs 'tmp/iaf-dev' } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    // -PjeiDev adds the full JEI to dev runs so the plugin can be checked in game.
    if (project.hasProperty('jeiDev')) runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    devModJars.each { jar ->
        def base = jar.name - '.jar'; int dash = base.lastIndexOf('-')
        runtimeOnly fg.deobf("local:${base.substring(0, dash)}:${base.substring(dash + 1)}")
    }
    if (project.hasProperty('iafDev')) {
        runtimeOnly fg.deobf('local:iceandfire:2.1.13')
        runtimeOnly fg.deobf('local:citadel:2.6.3')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'arsenal.refmap.json'
    config 'arsenal.mixins.json'
}
jar {
    manifest { attributes 'MixinConfigs': 'arsenal.mixins.json' }
    // The pose-capture tool (com.nanonaitor.arsenal.dev) is development-only.
    exclude 'com/nanonaitor/arsenal/dev/**'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
jar.finalizedBy('reobfJar')
tasks.configureEach {
    if (name == 'runGameTestServer') doFirst { copy { from 'gameteststructures'; into 'run/gameteststructures' } }
}
processResources {
    exclude 'assets/nanonaitors_arsenal/items/**'
    exclude 'data/nanonaitors_arsenal/recipe/**'
    exclude 'data/nanonaitors_arsenal/enchantment/**'
    exclude 'data/**/tags/item/**'
    exclude 'data/**/tags/block/**'
}
